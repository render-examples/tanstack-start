version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"
    groups:
      core-runtime:
        applies-to: "version-updates"
        patterns:
          - "@tanstack/react-router"
          - "@tanstack/react-start"
          - "@types/node"
          - "@types/react"
          - "@types/react-dom"
          - "@vitejs/plugin-react"
          - "nitro"
          - "react"
          - "react-dom"
          - "typescript"
          - "vite"
        update-types:
          - "minor"
          - "patch"
      development-tooling:
        applies-to: "version-updates"
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Etc/UTC"
    groups:
      github-actions:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
