# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: tanstack-start
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: HOST
        value: 0.0.0.0
